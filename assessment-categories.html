
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessment Categories | ReadQuest</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      color: #F5F8FF;
      background-color: #071329;
      background-image: radial-gradient(ellipse at top center, #14284a 0%, #071329 70%);
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: Poppins, sans-serif;
    }

    .category-page {
      width: 100%;
      max-width: 1100px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 35px 24px;
    }

    .category-header {
      margin-bottom: 30px;
      padding: 30px;
      background: rgba(10, 20, 45, 0.96);
      border: 2px solid #2A4A8F;
      border-radius: 20px;
    }

    .category-header h1 {
      margin: 0 0 14px;
      color: #FFD54A;
      font-size: clamp(19px, 3vw, 28px);
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .category-header p {
      margin: 0;
      color: #D8E7FF;
      line-height: 1.8;
    }

    .category-title {
      margin: 0 0 20px;
      color: #FFD54A;
      font-size: 23px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      width: 100%;
    }

    .category-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      min-width: 0;
      min-height: 190px;
      padding: 25px 15px;
      text-align: center;
      font: inherit;
      color: #F5F8FF;
      background: rgba(10, 20, 45, 0.96);
      border: 2px solid #2A4A8F;
      border-radius: 18px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .category-card:hover,
    .category-card:focus-visible {
      transform: translateY(-4px);
      border-color: #69B8FF;
      outline: none;
    }

    .category-card i {
      color: #4E8DFF;
      font-size: 38px;
    }

    .category-card h2 {
      margin: 0;
      color: #FFD54A;
      font-size: 20px;
    }

    .category-card span {
      color: #D8E7FF;
      font-size: 14px;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
      padding: 12px 20px;
      color: white;
      background: #2D8CFF;
      border: none;
      border-radius: 10px;
      font: inherit;
      cursor: pointer;
    }

    .back-button:hover { background: #4FA7FF; }

    .category-card:focus-visible,
    .back-button:focus-visible {
      outline: 3px solid #FFD54A;
      outline-offset: 3px;
    }

    @media (max-width: 600px) {
      .category-page { padding: 24px 16px; }
      .category-header { padding: 22px; }
      .category-grid { grid-template-columns: 1fr; gap: 16px; }
      .category-card { min-height: 165px; padding: 18px 8px; }
      .category-card i { font-size: 30px; }
      .category-card h2 { font-size: 16px; }
      .category-card span { font-size: 12px; }
    }
  </style>
</head>

<body>
  <main class="category-page">
    <header class="category-header">
      <h1 id="gradeHeading">Assessment Categories</h1>
      <p>Select a reading skill to continue your ReadQuest adventure.</p>
    </header>

    <h2 class="category-title">📚 Choose a Category</h2>

    <section class="category-grid" aria-label="Assessment categories">
      <button class="category-card" type="button" id="textComprehensionButton">
        <i class="fa-solid fa-book-open" aria-hidden="true"></i>
        <h2>Text Comprehension</h2>
        <span>Read and understand passages →</span>
      </button>

      <button class="category-card" type="button" id="vocabularyButton">
        <i class="fa-solid fa-book" aria-hidden="true"></i>
        <h2>Vocabulary</h2>
        <span>Explore vocabulary games →</span>
      </button>

      <button class="category-card" type="button" data-coming-soon>
        <i class="fa-solid fa-puzzle-piece" aria-hidden="true"></i>
        <h2>Phonemic Awareness</h2>
        <span>Coming soon</span>
      </button>

      <button class="category-card" type="button" data-coming-soon>
        <i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>
        <h2>Phonics</h2>
        <span>Coming soon</span>
      </button>
    </section>

    <button class="back-button" id="backButton" type="button">
      <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
      Back to Grades
    </button>
  </main>

<script>
  "use strict";

  const params = new URLSearchParams(window.location.search);
  const grade = params.get("grade");
  const validGrades = ["7", "8", "9", "10"];
  const validGrade = validGrades.includes(grade);

  document.getElementById("gradeHeading").textContent =
    validGrade
      ? `Grade ${grade} — Assessment Categories`
      : "Assessment Categories";

  // Text Comprehension → game selection page
  document.getElementById("textComprehensionButton")
    .addEventListener("click", () => {
      if (!validGrade) {
        window.location.href = "lessons.html";
        return;
      }

      window.location.href =
        `text-comprehension-games.html?grade=${encodeURIComponent(grade)}`;
    });

  // Vocabulary → existing vocabulary games page
      
       
  // Vocabulary → Vocabulary Games selection page
  document.getElementById("vocabularyButton")
    .addEventListener("click", () => {
      if (!validGrade) {
        window.location.href = "lessons.html";
        return;
      }

      window.location.href =
        `vocabulary-games.html?grade=${encodeURIComponent(grade)}`;
    });



  // Categories that are not ready yet
  document.querySelectorAll("[data-coming-soon]")
    .forEach((button) => {
      button.addEventListener("click", () => {
        alert("This assessment category is coming soon!");
      });
    });

  // Back to grade selection
  document.getElementById("backButton")
    .addEventListener("click", () => {
      window.location.href = "lessons.html";
    });
</script>

</body>
</html>
